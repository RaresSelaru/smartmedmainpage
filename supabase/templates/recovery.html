<!doctype html>
<html lang="ro">
  <body style="margin:0;background:#f7f3ea;color:#123a3f;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <h1 style="margin:0 0 16px;font-size:28px">Resetarea parolei SmartMed</h1>
      <p style="line-height:1.6">Folosește butonul de mai jos pentru a alege o parolă nouă.</p>
      <p style="margin:28px 0">
        <a
          href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery"
          style="display:inline-block;border-radius:999px;background:#0f7378;color:#fff;padding:14px 24px;text-decoration:none"
        >Alege o parolă nouă</a>
      </p>
      <p style="color:#607376;font-size:13px;line-height:1.5">
        Dacă nu ai cerut resetarea parolei, ignoră mesajul și parola ta va rămâne neschimbată.
      </p>
    </div>
  </body>
</html>
